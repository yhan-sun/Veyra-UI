name: Deploy Soflume UI Showcase to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies (Core Package)
        run: |
          cd packages/soflume_ui
          flutter pub get

      - name: Run Core Library Tests
        run: |
          cd packages/soflume_ui
          flutter test

      - name: Get Dependencies (Example Showcase)
        run: |
          cd example
          flutter pub get

      - name: Run Example Widget Tests
        run: |
          cd example
          flutter test

      - name: Build Web Showcase
        run: |
          cd example
          flutter build web --base-href "/Veyra-UI/" --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
          cname: ''
