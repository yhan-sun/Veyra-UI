name: CI Quality Gate & Deploy Showcase

on:
  push:
    branches:
      - main
      - 'phase-**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test & Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd packages/soflume_ui && flutter pub get
          cd ../../example && flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Core Library Tests
        run: |
          cd packages/soflume_ui
          flutter test

      - name: Run Example Showcase Tests
        run: |
          cd example
          flutter test

      - name: Verify Package Dry-Run
        run: |
          cd packages/soflume_ui
          flutter pub publish --dry-run

      - name: Verify DartDoc Documentation Generation
        run: |
          cd packages/soflume_ui
          dart doc .

      - name: Build Web Showcase Release
        run: |
          cd example
          flutter build web --base-href "/Veyra-UI/" --release

      - name: Deploy to GitHub Pages (Main Branch Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
          cname: ''
