<!DOCTYPE html>
<html>
<head>
  <base href="/Veyra-UI/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Soflume UI — 面向未来的 Flutter 高端跨平台设计系统与组件库（Soft Lumen 柔光美学）。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Soflume UI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Soflume UI — 柔光美学 Flutter 设计系统与组件展馆</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #101218;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #9EA8FF;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(158, 168, 255, 0.2);
      border-radius: 50%;
      border-top-color: #9EA8FF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <p style="margin-top: 18px; font-size: 14px; letter-spacing: 0.5px; opacity: 0.8;">加载 Soflume UI 柔光设计系统...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
